<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive webpage using CSS Flexbox and Grid.">
    <title>CSS Layout Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>

</html>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="#" class="logo">ES6+ Product Explorer</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">WEEK 1 · DAY 3</p>
            <h1>JavaScript ES6+ Basics</h1>
            <p>
                Explore arrow functions, destructuring,
                array methods, and event listeners.
            </p>
        </section>

        <section class="features" aria-labelledby="products-title">
            <h2 id="products-title">Product List</h2>

            <p id="count" aria-live="polite"></p>

            <button id="filter-button" class="primary-button" type="button">
                Show In-Stock Products
            </button>

            <div id="product-list" class="card-grid"></div>

            <p class="total">
                Total displayed product value:
                <strong id="total">₹0</strong>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 JavaScript ES6+ Internship Task</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
