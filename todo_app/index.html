
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            padding: 50px 15px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #26334a;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 0;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #addBtn {
            background: #2563eb;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f5f6fa;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: gray;
        }

        .complete-btn {
            background: #16a34a;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        #emptyMessage {
            text-align: center;
            color: gray;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >
            <button id="addBtn">Add</button>
        </div>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
